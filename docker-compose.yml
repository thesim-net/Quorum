services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quorum}
      POSTGRES_USER: ${POSTGRES_USER:-quorum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quorum} -d ${POSTGRES_DB:-quorum}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    # Self-hosters pull the published image; `docker compose build` (or
    # `up --build`) rebuilds locally for development.
    image: ghcr.io/thesim-net/quorum-api:${QUORUM_VERSION:-latest}
    build:
      context: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-quorum}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-quorum}
      PUBLIC_URL: ${PUBLIC_URL:?PUBLIC_URL is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      RESPONDENT_PEPPER: ${RESPONDENT_PEPPER:?RESPONDENT_PEPPER is required}
      # Optional. Leave unset and connect Discord through the setup wizard,
      # which stores the credentials encrypted in the database so they survive
      # a redeploy. Setting all four instead pins configuration to the
      # environment and makes the wizard read-only.
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      BOOTSTRAP_ADMIN_IDS: ${BOOTSTRAP_ADMIN_IDS:-}
      ADMIN_ROLE_IDS: ${ADMIN_ROLE_IDS:-}
      GEO_DATA_DIR: ${GEO_DATA_DIR:-/data/geoip}
      UPLOADS_DIR: /data/uploads
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      # For automatic updates. _DIR is this project as mounted inside the
      # container; _HOST_DIR is the same directory as the host knows it, since
      # the updater's binds are resolved by the host's daemon.
      QUORUM_COMPOSE_DIR: ${QUORUM_COMPOSE_DIR:-}
      QUORUM_COMPOSE_HOST_DIR: ${QUORUM_COMPOSE_HOST_DIR:-}
    volumes:
      - ./data/geoip:/data/geoip
      - uploads:/data/uploads
      # Uncomment to let Quorum update itself. The socket is root on the host,
      # so this is opt-in; without it only the update buttons are inert.
      #
      # The api service also needs group_add with the host's docker gid (see
      # `getent group docker`) - it runs as a non-root user, and the socket is
      # root:docker 0660, so a mount on its own gets EACCES.
      #
      # - /var/run/docker.sock:/var/run/docker.sock
      # - .:/compose

  web:
    image: ghcr.io/thesim-net/quorum-web:${QUORUM_VERSION:-latest}
    build:
      context: ./web
      args:
        VITE_PUBLIC_URL: ${PUBLIC_URL}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${HTTP_PORT:-8080}:80"

volumes:
  db_data:
  uploads:
