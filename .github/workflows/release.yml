name: Release

# Builds and publishes the api and web images to GHCR on every version tag
# (e.g. v1.0.1), and creates a GitHub Release. The in-app update check reads
# that release to tell self-hosters a newer version is available.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from the tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the API image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/quorum-api:${{ steps.version.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/quorum-api:latest

      - name: Build and push the web image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/quorum-web:${{ steps.version.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/quorum-web:latest

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
