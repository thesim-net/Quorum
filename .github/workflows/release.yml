name: Release

# Builds and publishes the api and web images to GHCR on every version tag
# (e.g. v1.0.1), and creates a GitHub Release. The in-app update check reads
# that release to tell self-hosters a newer version is available.
on:
  push:
    tags:
      - 'v*'

# id-token + attestations let the job sign a Sigstore build-provenance
# statement for each published image, tying its digest to this repo, this
# commit, and this workflow. Anyone can then verify a pulled image with
# `gh attestation verify` (see README "Verifying a build").
permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Derive version and build metadata
        id: meta
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          # GHCR rejects uppercase image paths and the org is "TheSim-net",
          # so the owner has to be lowercased before it goes in a tag.
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the API image
        id: build_api
        uses: docker/build-push-action@v7
        with:
          context: ./api
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/quorum-api:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner }}/quorum-api:latest

      - name: Build and push the web image
        id: build_web
        uses: docker/build-push-action@v7
        with:
          context: ./web
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/quorum-web:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner }}/quorum-web:latest

      - name: Attest API image provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ steps.meta.outputs.owner }}/quorum-api
          subject-digest: ${{ steps.build_api.outputs.digest }}
          push-to-registry: true

      - name: Attest web image provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ steps.meta.outputs.owner }}/quorum-web
          subject-digest: ${{ steps.build_web.outputs.digest }}
          push-to-registry: true

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
