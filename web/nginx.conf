# Cache policy is resolved here rather than with a per-location add_header.
# An add_header inside a location block replaces every header inherited from
# the server block, which would silently drop the security headers below on
# exactly the responses that need them most.
map $uri $quorum_cache_control {
    # Hashed build assets never change under the same name.
    ~^/assets/  "public, max-age=31536000, immutable";
    # Everything else, index.html above all, must revalidate or clients pin
    # themselves to a stale bundle after a deploy.
    default     "no-store";
}

server {
    listen 80;
    # Without this, a host resolving the container to ::1 gets connection
    # refused even though nginx is up.
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Quorum serves no third-party assets, so the policy can stay strict.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://cdn.discordapp.com; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Cache-Control $quorum_cache_control always;

    # Large enough for the biggest permitted file upload, plus multipart
    # overhead. The API still enforces per-question limits below this.
    client_max_body_size 26m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
